<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WattCalc — 分享結果</title>
  <meta name="description" content="查看這組電腦配置的功耗計算結果。" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/sections.css" />

  <style>
    body {
      font-family: var(--font-sans);
      background: var(--color-bg);
      color: var(--color-text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      line-height: var(--leading-normal);
    }

    /* Header */
    .result-header {
      padding: var(--space-5) var(--space-8);
      border-bottom: 1px solid var(--color-border-light);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(253, 250, 244, 0.90);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .result-header .logo {
      font-size: var(--text-lg);
      font-weight: var(--weight-semi);
      letter-spacing: var(--tracking-tight);
    }

    .result-header .logo span { color: var(--color-accent); }

    /* 主內容 */
    .result-page {
      flex: 1;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
      padding: var(--space-12) var(--space-8);
    }

    .result-page__eyebrow {
      font-size: var(--text-xs);
      font-weight: var(--weight-medium);
      letter-spacing: var(--tracking-wider);
      text-transform: uppercase;
      color: var(--color-accent);
      margin-bottom: var(--space-2);
    }

    .result-page__title {
      font-size: var(--text-4xl);
      font-weight: var(--weight-light);
      letter-spacing: var(--tracking-tight);
      margin-bottom: var(--space-8);
    }

    /* Hero 數字 */
    .watt-hero {
      display: flex;
      align-items: center;
      gap: var(--space-6);
      padding: var(--space-10) var(--space-8);
      background: var(--color-surface);
      border: 1px solid var(--color-border-light);
      border-radius: var(--radius-2xl);
      margin-bottom: var(--space-6);
      position: relative;
      overflow: hidden;
    }

    .watt-hero::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--color-accent), var(--color-accent-light));
    }

    .watt-hero__number {
      font-size: 5rem;
      font-weight: var(--weight-light);
      color: var(--color-text);
      font-variant-numeric: tabular-nums;
      letter-spacing: var(--tracking-tight);
      line-height: 1;
    }

    .watt-hero__unit {
      font-size: var(--text-2xl);
      color: var(--color-accent);
    }

    .watt-hero__meta {
      margin-left: auto;
      text-align: right;
    }

    .watt-hero__psu {
      font-size: var(--text-xl);
      font-weight: var(--weight-medium);
      color: var(--color-text);
      margin-bottom: var(--space-2);
    }

    .watt-hero__note {
      font-size: var(--text-sm);
      color: var(--color-text-muted);
    }

    /* 統計格 */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: var(--space-4);
      margin-bottom: var(--space-8);
    }

    /* 兩欄 layout */
    .content-grid {
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: var(--space-8);
    }

    .section-label {
      font-size: var(--text-sm);
      font-weight: var(--weight-semi);
      color: var(--color-text);
      margin-bottom: var(--space-4);
    }

    /* 電費說明 */
    .power-info {
      background: var(--color-surface);
      border: 1px solid var(--color-border-light);
      border-radius: var(--radius-xl);
      padding: var(--space-6);
      font-size: var(--text-sm);
    }

    .power-info__row {
      display: flex;
      justify-content: space-between;
      padding: var(--space-2) 0;
      border-bottom: 1px solid var(--color-border-light);
    }

    .power-info__row:last-child { border-bottom: none; }
    .power-info__label { color: var(--color-text-muted); }
    .power-info__value { font-weight: var(--weight-medium); }

    /* 錯誤狀態 */
    .error-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--space-6);
      padding: var(--space-20);
      text-align: center;
      flex: 1;
    }

    .error-state__icon { font-size: 3rem; opacity: 0.4; }
    .error-state__title {
      font-size: var(--text-2xl);
      font-weight: var(--weight-light);
      color: var(--color-text);
    }
    .error-state__desc {
      font-size: var(--text-base);
      color: var(--color-text-muted);
      max-width: 400px;
    }

    /* Actions */
    .result-page__actions {
      display: flex;
      gap: var(--space-4);
      margin-top: var(--space-8);
      flex-wrap: wrap;
    }

    /* 腳位標籤 */
    .socket-info {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      margin-bottom: var(--space-6);
      font-size: var(--text-sm);
      color: var(--color-text-muted);
    }

    /* Responsive */
    @media (max-width: 768px) {
      .result-page { padding: var(--space-6) var(--space-4); }
      .watt-hero { flex-direction: column; align-items: flex-start; }
      .watt-hero__meta { text-align: left; margin-left: 0; }
      .stats-grid { grid-template-columns: 1fr 1fr; }
      .content-grid { grid-template-columns: 1fr; }
      .result-header { padding: var(--space-4); }
    }
    @media (max-width: 480px) {
      .watt-hero__number { font-size: 3.5rem; }
      .stats-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="result-header">
    <div class="logo">Watt<span>Calc</span> <span style="color:var(--color-text-muted);font-weight:300">· 分享結果</span></div>
    <a href="index.html" class="btn btn--ghost btn--sm">自己算算看</a>
  </header>

  <!-- 主內容（由 JS 動態填充）-->
  <main id="result-page-root" class="result-page">
    <!-- loading state -->
    <div id="loading-state" style="text-align:center;padding:6rem 0;color:var(--color-text-muted);">
      讀取中…
    </div>
  </main>

  <!-- JS -->
  <script src="js/data.js"></script>
  <script src="js/state.js"></script>
  <script src="js/calculator.js"></script>
  <script src="js/share.js"></script>
  <script>
  document.addEventListener('DOMContentLoaded', function() {
    const root = document.getElementById('result-page-root');

    // 從 URL 讀取分享資料
    const snapshot = readShareFromUrl();

    if (!snapshot) {
      root.innerHTML = `
        <div class="error-state">
          <div class="error-state__icon">⚠️</div>
          <div class="error-state__title">找不到計算結果</div>
          <div class="error-state__desc">這個分享連結可能已過期或格式不正確。</div>
          <a href="index.html" class="btn btn--primary">建立新計算</a>
        </div>
      `;
      return;
    }

    // 還原狀態
    state.restore(snapshot);

    const partIds = state.selectedPartIds;
    const result  = getFullResult(partIds, state.pricePerKwh, state.hoursPerDay);
    const { totalPeakWatt, suggestedPSU, breakdown, electricity } = result;
    const { monthlyCost, yearlyCost, kwhPerMonth, dailyCost } = electricity;
    const psuInfo = getPSUGrade(totalPeakWatt);

    // 取腳位資訊
    const socketDef = getSocketList().find(s => s.id === snapshot.selectedSocket);
    const socketLabel = socketDef ? `${socketDef.name} · ${socketDef.desc}` : '未知腳位';

    // 使用者選的零件
    const userBreakdown = breakdown.filter(b => !b.id.startsWith('_'));

    root.innerHTML = `
      <div class="anim-fade-up">
        <p class="result-page__eyebrow">計算結果</p>
        <h1 class="result-page__title">電腦功耗分析</h1>

        <div class="socket-info">
          <span class="badge badge--accent">${socketLabel}</span>
          <span>${userBreakdown.length} 件零組件</span>
        </div>

        <div class="watt-hero">
          <div>
            <div style="font-size:var(--text-xs);color:var(--color-text-muted);letter-spacing:0.1em;text-transform:uppercase;margin-bottom:0.5rem;">
              峰值功耗（估算）
            </div>
            <div style="display:flex;align-items:baseline;gap:0.5rem;">
              <span class="watt-hero__number">${totalPeakWatt.toLocaleString('zh-TW')}</span>
              <span class="watt-hero__unit">W</span>
            </div>
          </div>
          <div class="watt-hero__meta">
            <div class="watt-hero__psu">建議電供：${suggestedPSU} W</div>
            <div class="watt-hero__note">${psuInfo.label}</div>
          </div>
        </div>

        <div class="stats-grid">
          <div class="result-stat">
            <div class="result-stat__label">每月電費</div>
            <div class="result-stat__value">${Math.round(monthlyCost).toLocaleString('zh-TW')}<span class="result-stat__unit">元</span></div>
          </div>
          <div class="result-stat">
            <div class="result-stat__label">每年電費</div>
            <div class="result-stat__value">${Math.round(yearlyCost).toLocaleString('zh-TW')}<span class="result-stat__unit">元</span></div>
          </div>
          <div class="result-stat">
            <div class="result-stat__label">每月用電</div>
            <div class="result-stat__value">${kwhPerMonth}<span class="result-stat__unit">度</span></div>
          </div>
          <div class="result-stat">
            <div class="result-stat__label">每日時數</div>
            <div class="result-stat__value">${state.hoursPerDay}<span class="result-stat__unit">小時</span></div>
          </div>
          <div class="result-stat">
            <div class="result-stat__label">電費單價</div>
            <div class="result-stat__value">${state.pricePerKwh}<span class="result-stat__unit">元/度</span></div>
          </div>
          <div class="result-stat">
            <div class="result-stat__label">每日電費</div>
            <div class="result-stat__value">${Math.round(dailyCost * 10) / 10}<span class="result-stat__unit">元</span></div>
          </div>
        </div>

        <div class="content-grid">
          <div>
            <div class="section-label">零件明細</div>
            <div class="parts-breakdown">
              ${breakdown.map(b => `
                <div class="parts-breakdown__item">
                  <span class="parts-breakdown__name">${b.name}</span>
                  <span class="parts-breakdown__watt">${b.peakWatt} W</span>
                </div>
              `).join('')}
            </div>
          </div>
          <div>
            <div class="section-label">計算設定</div>
            <div class="power-info">
              <div class="power-info__row">
                <span class="power-info__label">CPU 腳位</span>
                <span class="power-info__value">${socketDef ? socketDef.name : '—'}</span>
              </div>
              <div class="power-info__row">
                <span class="power-info__label">零件數量</span>
                <span class="power-info__value">${userBreakdown.length} 件</span>
              </div>
              <div class="power-info__row">
                <span class="power-info__label">電費單價</span>
                <span class="power-info__value">${state.pricePerKwh} 元/度</span>
              </div>
              <div class="power-info__row">
                <span class="power-info__label">每日使用</span>
                <span class="power-info__value">${state.hoursPerDay} 小時</span>
              </div>
              <div class="power-info__row">
                <span class="power-info__label">系統基礎耗電</span>
                <span class="power-info__value">50 W（主機板）</span>
              </div>
            </div>
          </div>
        </div>

        <div class="result-page__actions">
          <a href="index.html" class="btn btn--primary">自己算算看</a>
          <button class="btn btn--ghost" id="share-again">複製分享連結</button>
        </div>
      </div>
    `;

    // 複製分享連結
    document.getElementById('share-again')?.addEventListener('click', async () => {
      const ok = await copyToClipboard(location.href);
      const btn = document.getElementById('share-again');
      if (btn) {
        btn.textContent = ok ? '✓ 已複製！' : '複製失敗';
        setTimeout(() => { btn.textContent = '複製分享連結'; }, 2000);
      }
    });

    // 觸發進場動畫
    requestAnimationFrame(() => {
      document.querySelectorAll('.anim-fade-up').forEach(el => el.classList.add('in-view'));
    });
  });
  </script>
</body>
</html>
